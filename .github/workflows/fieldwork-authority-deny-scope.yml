name: Fieldwork authority deny scope

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  authority-deny-scope:
    if: github.head_ref == 'fieldwork/743-authority-deny-scope-red' || github.head_ref == 'fieldwork/743-authority-deny-scope-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate repair
        if: github.head_ref == 'fieldwork/743-authority-deny-scope-fix'
        run: git apply .fieldwork-authority-deny-scope.patch
      - name: Run focused authority controls
        run: cargo test -p tauri --no-default-features --features test --test fieldwork_authority_deny_scope -- --nocapture
