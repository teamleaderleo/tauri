name: Fieldwork authority deny scope

on:
  push:
    branches:
      - fieldwork/743-authority-deny-scope-red

permissions:
  contents: read

jobs:
  authority-deny-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Run focused authority controls
        run: cargo test -p tauri --no-default-features --features test --test fieldwork_authority_deny_scope -- --nocapture
