name: Fieldwork authority current dev

on:
  pull_request:
    branches:
      - fieldwork/743-current-dev-base

permissions:
  contents: read

jobs:
  authority-current-dev:
    if: github.head_ref == 'fieldwork/743-authority-current-dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply candidate repair and unit regressions
        run: |
          python3 .fieldwork-authority-deny-scope.py
          python3 .fieldwork-authority-unit-tests.py
      - name: Check candidate diff
        run: |
          git diff --check
          git diff -- crates/tauri/src/ipc/authority.rs
      - name: Check candidate formatting
        run: cargo fmt --all -- --check
      - name: Run focused authority controls
        run: cargo test -p tauri --no-default-features --features test --test fieldwork_authority_deny_scope -- --nocapture
      - name: Run authority unit regressions
        run: cargo test -p tauri --no-default-features --features test --lib ipc::authority::tests -- --nocapture
      - name: Clippy candidate authority path
        run: cargo clippy -p tauri --no-default-features --features test --lib -- -D warnings
