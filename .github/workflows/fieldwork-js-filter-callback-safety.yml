name: Fieldwork JS filter callback safety

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  js-filter-callback-safety:
    if: github.head_ref == 'fieldwork/js-filter-callback-safety'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Inject focused callback-safety controls
        run: python3 .fieldwork-js-filter-callback-safety.py
      - name: Run listener-registry controls
        run: cargo test -p tauri --no-default-features --features test --lib js_filter_ -- --nocapture
      - name: Run webview-store control
        if: always()
        run: cargo test -p tauri --no-default-features --features test --lib app_emit_filter_predicate_runs_without_webview_store_lock -- --nocapture
