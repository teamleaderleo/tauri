name: Fieldwork 774 controlled formatter

on:
  pull_request:
    branches:
      - fieldwork/774-materialize-base

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply repository rustfmt
        shell: bash
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "already formatted"
            exit 0
          fi
          git diff --check
          git config user.name "fieldwork-agent"
          git config user.email "fieldwork-agent@users.noreply.github.com"
          git add crates/tauri/src/ipc/authority.rs crates/tests/acl/tests/global_scope_cache.rs
          git commit -m "style(acl): format global scope cache candidate"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
