name: Fieldwork plugin store reentrancy

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  plugin-store-reentrancy:
    if: github.head_ref == 'fieldwork/plugin-store-reentrancy' || github.head_ref == 'fieldwork/plugin-store-reentrancy-fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply callback-ownership candidate
        if: github.head_ref == 'fieldwork/plugin-store-reentrancy-fix'
        run: python3 .fieldwork-plugin-store-reentrancy-fix.py
      - name: Inject focused plugin-store controls
        run: python3 .fieldwork-plugin-store-reentrancy.py
      - name: Run plugin-store callback ownership controls
        shell: bash
        run: |
          set -o pipefail
          cargo test -p tauri --no-default-features --features test --lib fieldwork_plugin_store_reentrancy -- --nocapture 2>&1 | tee fieldwork-plugin-store-result.txt
      - name: Upload focused receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-plugin-store-${{ github.head_ref }}
          path: fieldwork-plugin-store-result.txt
