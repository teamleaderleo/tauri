name: Fieldwork Rust event panic current dev

on:
  pull_request:
    branches:
      - fieldwork/749-current-dev-base

permissions:
  contents: read

jobs:
  rust-event-panic-current-dev:
    if: github.head_ref == 'fieldwork/749-rust-event-panic-current-dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply panic-recovery candidate and filter-panic regression
        run: |
          python3 .fieldwork-rust-event-panic-fix.py
          python3 .fieldwork-rust-filter-panic-test.py
      - name: Normalize and retain candidate diff
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff -- crates/tauri/src/event/listener.rs | tee /tmp/fieldwork-749-rust-event-panic.patch
      - name: Upload candidate patch
        uses: actions/upload-artifact@v4
        with:
          name: fieldwork-749-rust-event-panic-candidate
          path: /tmp/fieldwork-749-rust-event-panic.patch
          if-no-files-found: error
      - name: Run filter-panic recovery regression
        run: cargo test -p tauri --no-default-features --features test --lib rust_filter_panic_ -- --nocapture
      - name: Run nearby event tests
        run: cargo test -p tauri --no-default-features --features test --lib event::listener::test -- --nocapture
      - name: Clippy candidate path
        run: cargo clippy -p tauri --no-default-features --features test --lib -- -D warnings
